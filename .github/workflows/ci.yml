name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Skill consistency
        if: always()
        run: npm run skills:check
      - name: Lint
        if: always()
        run: npm run lint
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Dependency audit
        if: always()
        run: npm run audit:high

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and core tests
        run: npm test
      - name: Coverage thresholds
        run: npm run test:coverage

  openspec-integration:
    name: openspec-integration
    runs-on: ubuntu-latest
    env:
      OPENSPEC_VERSION: 1.12.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@${OPENSPEC_VERSION}
      - name: OpenSpec smoke
        run: npm run openspec:smoke
